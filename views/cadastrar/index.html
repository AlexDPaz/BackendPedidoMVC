<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../StylerPrincipal.css">
</head>

<body>

    <main class="login-container">
        <div class="login-card">
            <h1>Criar conta</h1>
            <p class="subtitle">Cadastre-se para acessar o sistema</p>

            <form id="formCadastro">
                <div class="form-group">
                    <label for="nome">
                        Nome
                    </label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">
                        E-mail
                    </label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="senha">
                        Senha
                    </label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>
                    <input
                        type="password"
                        id="confirmarSenha"
                        placeholder="Digite a senha novamente"
                        required
                    >
                </div>

                <button type="submit">
                    Cadastrar
                </button>
            </form>

            <p id="mensagem"></p>

            <p class="link-text">
                Já possui uma conta?
                <a href="../login">Fazer login</a>
            </p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
